# Destino de cada ficha del directorio viejo cuando se retire (solo después de aprobar los rankings).
# Las fichas no tienen categoría en WordPress: se clasifican por su slug y nombre, y las URLs viejas
# /proveedores/<categoría>/... por la categoría de la ruta. La primera regla que coincide gana.
reglas:
  - [ "doblaje|subtitul|locuci|locutor|grabacion|dubb", /rankings/estudios-doblaje-locucion-mexico/ ]
  - [ "modelo|edecan|talento|casting", /rankings/productoras-de-eventos-mexico/ ]
  - [ "radio|estaciones-de-radio|\\d{2,3}\\.\\d\\b|\\bfm\\b", /rankings/grupos-radiofonicos-mexico/ ]
  - [ "productora|producciones|films|film\\b|cine|television|video|animacion|postproduc|fotografia", /rankings/casas-productoras-mexico/ ]
  - [ "investigacion|mercados|research|encuesta|opinion|estudios-de-mercado|focus", /rankings/agencias-investigacion-de-mercados-mexico/ ]
  - [ "relaciones-publicas|\\brp\\b|\\bpr\\b|prensa", /rankings/agencias-relaciones-publicas-mexico/ ]
  - [ "medios|media|central", /rankings/agencias-de-medios-mexico/ ]
  - [ "exterior|espectacular|carteleras|vallas|parabus|outdoor|anuncios|medios-alternos|camiones|pantallas", /rankings/empresas-publicidad-exterior-mexico/ ]
  - [ "inbound|seo|digital|web|online|redes|social|e-?mail|buscadores|hosting|marketing-digital", /rankings/agencias-inbound-marketing-mexico/ ]
  - [ "btl|promocion|promotoria|promotion|activacion|trade|promo\\b", /rankings/agencias-btl-promotoria-mexico/ ]
  - [ "impres|imprenta|grafic|pop|display|promocional|serigraf|litograf|etiqueta|empaque|bolsas|senal|signal|lona|banners|offset|stands-y-display", /rankings/proveedores-pop-promocionales-mexico/ ]
  - [ "evento|expo|stand|convencion|banquete|carpa|photobooth|cabina|feria|congreso", /rankings/productoras-de-eventos-mexico/ ]
  - [ "diseno|dise%c3%b1o|design|branding|marca|identidad|creativ", /rankings/estudios-diseno-branding-mexico/ ]
  - [ "comunicacion|marketing|mercadotecnia|consultor|estrateg|integral|360", /rankings/agencias-de-marketing-mexico/ ]
  - [ "monterrey|nuevo-leon|san-pedro", /rankings/agencias-de-publicidad-monterrey/ ]
  - [ "queretaro", /rankings/agencias-de-publicidad-queretaro/ ]
# Agencias genéricas ("servicios de publicidad") se mandan al ranking de su ciudad o estado.
estados:
  - [ "nuevo le[oó]n", /rankings/agencias-de-publicidad-monterrey/ ]
  - [ "quer[eé]taro", /rankings/agencias-de-publicidad-queretaro/ ]
  - [ "distrito federal|ciudad de m[eé]xico|cdmx", /rankings/agencias-de-publicidad-cdmx/ ]
  - [ ".", /rankings/agencias-de-publicidad-por-estado/ ]
por_defecto: /rankings/agencias-de-publicidad-mexico/

# Excepciones por slug de ficha (slug: destino), para corregir a mano lo que las reglas clasifiquen mal.
fichas:
  augusto-elias: /rankings/agencias-de-publicidad-mexico/

# Mientras un ranking no esté publicado, sus fichas van al ranking publicado más cercano.
# Al publicarlo, basta volver a correr "aplicar" para reapuntarlas.
sustitutos:
  /rankings/agencias-de-publicidad-queretaro/: /rankings/agencias-de-publicidad-mexico/
  /rankings/agencias-de-publicidad-por-estado/: /rankings/agencias-de-publicidad-mexico/
  /rankings/agencias-relaciones-publicas-mexico/: /rankings/agencias-de-marketing-mexico/
  /rankings/grupos-radiofonicos-mexico/: /rankings/agencias-de-medios-mexico/
  /rankings/estudios-doblaje-locucion-mexico/: /rankings/casas-productoras-mexico/
  /rankings/estudios-diseno-branding-mexico/: /rankings/agencias-de-publicidad-mexico/

# Correcciones a mano para las fichas con más tráfico (si el texto aparece en la URL vieja o en el slug de la ficha).
# Van antes que cualquier otra regla. La categoría de la ruta vieja (/proveedores/<categoría>/...) va en segundo lugar.
urls:
  alparied: /rankings/proveedores-pop-promocionales-mexico/#displays-posters-y-material-pop
  interpublic: /rankings/agencias-de-medios-mexico/
  empresas-isal: /rankings/empresas-publicidad-exterior-mexico/#espectaculares-carteleras-y-vallas
  chuviscar: /rankings/agencias-de-medios-mexico/#periodicos-impresos-y-digitales
  capaco: /rankings/proveedores-pop-promocionales-mexico/#empaques-bolsas-y-etiquetas
  signaleticas: /rankings/proveedores-pop-promocionales-mexico/#impresion-offset-digital-gran-formato-y-serigrafia
  amfar: /rankings/proveedores-pop-promocionales-mexico/#articulos-promocionales-y-textiles
  tv-promo: /rankings/agencias-btl-promotoria-mexico/
  grupo-om: /rankings/proveedores-pop-promocionales-mexico/
  soltar-impresores: /rankings/proveedores-pop-promocionales-mexico/#impresion-offset-digital-gran-formato-y-serigrafia
  flexo-print: /rankings/proveedores-pop-promocionales-mexico/#empaques-bolsas-y-etiquetas
  carteleras-y-neon: /rankings/empresas-publicidad-exterior-mexico/#espectaculares-carteleras-y-vallas
  impactos-frecuencia: /rankings/agencias-de-medios-mexico/
  anuncios-en-directorios: /rankings/agencias-de-medios-mexico/
  eficolor: /rankings/proveedores-pop-promocionales-mexico/#impresion-offset-digital-gran-formato-y-serigrafia
