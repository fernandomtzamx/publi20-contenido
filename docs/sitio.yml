# Configuración de publi20.com que aplica scripts/site_setup.py.
# Se aplica con: Actions > Publicar en WordPress > Run workflow > setup
# (menús, portada, enlaces permanentes y redirecciones del directorio se hacen en wp-admin).

# Todas las entradas se publican a nombre de Fernando Martínez.
# Si el usuario de la API no es Fernando, pon aquí su id de usuario de WordPress.
autor:
  nombre: "Fernando Arturo Martínez Aguilar"
  id: 1
  # La cuenta de la API (id 1) es la de Fernando: su perfil público es /author/fernando-martinez/
  perfil:
    first_name: "Fernando Arturo"
    last_name: "Martínez Aguilar"
    name: "Fernando Arturo Martínez Aguilar"
    nickname: "Fernando Martínez"
    slug: "fernando-martinez"
    description: |-
      Fernando Arturo Martínez Aguilar es emprendedor digital, experto en inbound marketing y editor de Publi2.0, el medio sobre publicidad, mercadotecnia, negocios y emprendimiento en México.

      Trabaja en el cruce entre tecnología, inteligencia artificial y marketing: cómo atraer clientes con contenido útil, automatizar con criterio humano y usar la IA para crear, medir y vender mejor. En Publi2.0 escribe análisis, guías y rankings con una regla que no se negocia: cada dato lleva su fuente y nadie paga por aparecer.

      Contacto editorial: contacto@publi20.com.

# Cierra comentarios y pingbacks en todo el contenido existente y en los ajustes del sitio.
cerrar_comentarios: true

# Pilares y subsecciones. El padre va antes que sus hijas.
categorias:
  - {slug: publicidad, name: Publicidad, description: "Agencias, creatividad, medios y campañas en México, explicados sin jerga y con fuentes."}
  - {slug: creatividad, name: Creatividad, parent: publicidad}
  - {slug: medios, name: Medios, parent: publicidad}
  - {slug: guias, name: Guías, parent: publicidad}
  - {slug: mercadotecnia, name: Mercadotecnia, description: "Marketing digital, inbound, investigación de mercados y marca. Lo que funciona y lo que es humo."}
  - {slug: marketing-digital, name: Marketing digital, parent: mercadotecnia}
  - {slug: investigacion-de-mercados, name: Investigación de mercados, parent: mercadotecnia}
  - {slug: negocios, name: Negocios, description: "Empresas, sectores y decisiones de negocio en México, con datos verificables."}
  - {slug: automotriz, name: Automotriz, parent: negocios}
  - {slug: comercio-electronico, name: Comercio electrónico, parent: negocios}
  - {slug: emprendimiento, name: Emprendimiento, description: "Productividad, liderazgo, ventas y pymes para quien está construyendo su propio negocio."}
  - {slug: productividad, name: Productividad, parent: emprendimiento}
  - {slug: liderazgo, name: Liderazgo, parent: emprendimiento}
  - {slug: pymes, name: Pymes, parent: emprendimiento}
  - {slug: ventas, name: Ventas, parent: emprendimiento}
  - {slug: rankings, name: Rankings, description: "Rankings con metodología pública. Nadie paga por aparecer."}
  - {slug: noticias, name: Noticias, description: "Lo que pasó en publicidad, marketing y negocios, cada semana."}

# Portadas generadas con Gemini (todas las notas excepto rankings, que usan scripts/cover.py).
# Requiere el secreto GEMINI_API_KEY en GitHub.
imagenes:
  modelo: gemini-nano-banana-2.1
  modelos_respaldo: [gemini-3.1-flash-image, gemini-2.5-flash-image]
  aspecto: "16:9"
  tamano: "2K"
  ancho: 1600
  alto: 900
  prompt_base: >-
    Editorial photograph for a Mexican magazine about advertising, marketing and business.
    Scene: {escena}.
    Realistic documentary style, shot on a full-frame camera with a 35mm lens, natural light,
    shallow depth of field, rich but natural color, clean composition with negative space, 16:9.
    Absolutely no text, letters, numbers, signage, captions, logos, brand names, trademarks
    or watermarks anywhere in the image. No recognizable public figures or celebrities.
