# SEO de publi20.com con Rank Math. Lo aplica scripts/seo.py (docs/seo.txt con "aplicar").

# Módulos de Rank Math. Las redirecciones se quedan solo en el plugin Redirection (ya auditado),
# por eso el módulo de redirecciones de Rank Math se apaga.
modulos:
  sitemap: "on"
  rich-snippet: "on"
  404-monitor: "on"
  instant-indexing: "on"
  redirections: "off"

# Cambios sobre los ajustes actuales de Rank Math (el resto se conserva).
# El directorio (/listing/) ya redirige a los rankings: sale del sitemap.
ajustes:
  general:
    nofollow_external_links: "on"
    new_window_external_links: "on"
    add_img_alt: "on"
    img_alt_format: "%title%"
    breadcrumbs: "on"
    breadcrumbs_separator: "›"
    breadcrumbs_home_label: "Inicio"
    breadcrumbs_ancestor_categories: "on"
    breadcrumbs_archive_format: "%s"
    breadcrumbs_404_label: "Página no encontrada"
  titles:
    title_separator: "|"
    knowledgegraph_type: "company"
    knowledgegraph_name: "Publi2.0"
    website_name: "Publi2.0"
    website_alternate_name: "Publi 2.0"
    social_additional_profiles: "https://www.youtube.com/@Publi20"
    404_title: "Página no encontrada %sep% %sitename%"
    tax_category_add_meta_box: "on"
    noindex_empty_taxonomies: "on"
    disable_date_archives: "on"
    noindex_search: "on"
    pt_listing_robots: ["noindex"]
    pt_listing_custom_robots: "on"
  sitemap:
    include_images: "on"
    include_featured_image: "on"
    authors_sitemap: "off"
    pt_post_sitemap: "on"
    pt_page_sitemap: "on"
    pt_listing_sitemap: "off"
    tax_category_sitemap: "on"
    tax_post_tag_sitemap: "off"

# Logo de la organización y la imagen social por defecto (se suben a la biblioteca).
logo: brand/logo-publi20.png
imagen_social: images/og-publi20.png

portada:
  titulo: "Publi2.0: revista de publicidad, marketing y negocios en México"
  descripcion: "Análisis, guías y rankings de publicidad, mercadotecnia, negocios y emprendimiento en México. Sin jerga, con fuentes y con postura."
  palabra_clave: "revista de publicidad"

# Archivo de comunicados: se indexa solo lo que tuvo clics en Search Console (16 meses).
# Lo demás sigue publicado, con noindex y follow, y sale del sitemap.
archivo_noindex_sin_clics: true

