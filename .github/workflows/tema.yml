name: Tema del sitio

# docs/tema.txt: "inspeccionar" revisa logo, favicon y rutas del tema; "aplicar" aplica docs/tema.yml.
on:
  push:
    branches: [main]
    paths: ["docs/tema.txt", "docs/tema.yml", "scripts/tema.py", ".github/workflows/tema.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tema
  cancel-in-progress: false

jobs:
  tema:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_URL: ${{ secrets.WP_URL }}
      WP_USER: ${{ secrets.WP_USER }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q -r requirements.txt
      - name: Tema
        run: |
          if grep -q "aplicar" docs/tema.txt; then python scripts/tema.py --aplicar; else python scripts/tema.py --inspeccionar; fi
      - name: Capturas en celular
        if: always()
        continue-on-error: true
        run: |
          pip install -q playwright==1.55.0
          python -m playwright install --with-deps chromium > /dev/null
          python - <<'PY'
          import random
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page(viewport={"width": 390, "height": 844}, device_scale_factor=2, is_mobile=True, has_touch=True,
                              user_agent="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1")
              pg.goto(f"https://www.publi20.com/?nc={random.randint(1, 10**9)}", wait_until="networkidle", timeout=90000)
              pg.screenshot(path="registro/tema-movil.png", clip={"x": 0, "y": 0, "width": 390, "height": 160})
              info = pg.evaluate("""() => [...document.querySelectorAll('img')].filter(i => i.getBoundingClientRect().top < 120 && i.offsetWidth > 0)
                  .map(i => i.currentSrc + ' | ' + i.offsetWidth + 'x' + i.offsetHeight + ' | ' + (i.closest('[id]') || {}).id)""")
              open("registro/tema-inspeccion.log", "a").write("\\nImágenes visibles en el encabezado móvil:\\n" + "\\n".join(info) + "\\n")
              b.close()
          PY
      - name: Guardar en el repo
        if: always()
        run: |
          git config user.name "publi20-bot"
          git config user.email "publi20-bot@users.noreply.github.com"
          for f in registro/tema-inspeccion.log registro/tema.log registro/tema-movil.png; do [ -f "$f" ] && git add "$f"; done
          git commit -q -m "Tema del sitio [skip ci]" || exit 0
          git pull --rebase -q origin main && git push -q origin HEAD:main
